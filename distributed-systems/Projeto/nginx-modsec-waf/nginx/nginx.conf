# Balanceador de carga do laboratorio
# Referencias: https://nginx.org/en/docs/

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ---------- Logs ----------
    log_format lb '$remote_addr "$request" $status -> $upstream_addr '
                  '($upstream_response_time s) req_limit=$limit_req_status';
    access_log /dev/stdout lb;
    error_log  /dev/stderr warn;

    # ---------- Ocultar informacoes do servidor ----------
    server_tokens off;

    # ---------- Limites e timeouts (mitigam slowloris e corpos gigantes) ----------
    client_max_body_size        1m;
    client_body_buffer_size     16k;
    client_header_buffer_size   1k;
    large_client_header_buffers 4 8k;
    client_body_timeout         10s;
    client_header_timeout       10s;
    send_timeout                10s;
    keepalive_timeout           15s;
    reset_timedout_connection   on;

    # ---------- IP real do cliente vindo do WAF ----------
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header   X-Real-IP;

    # ---------- Rate limiting e limite de conexoes ----------
    limit_req_zone  $binary_remote_addr zone=geral:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=login:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=conexoes:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # ---------- Backends ----------
    upstream app_backend {
        # Padrao: round robin. Para testar outros algoritmos, descomente um:
        # least_conn;
        # ip_hash;

        # Health check passivo: 2 falhas em 10s tiram o servidor do pool por 10s
        server app1:5000 max_fails=2 fail_timeout=10s;
        server app2:5000 max_fails=2 fail_timeout=10s;
        server app3:5000 max_fails=2 fail_timeout=10s;

        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        limit_conn conexoes 20;

        include /etc/nginx/snippets/security-headers.conf;

        # Bloqueia arquivos ocultos (.env, .git, .htaccess...)
        location ~ /\.(?!well-known) {
            return 404;
        }

        # Login: so POST e limite rigido contra forca bruta
        location = /api/login {
            limit_except POST { deny all; }
            limit_req zone=login burst=10 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
        }

        # Demais rotas: GET/HEAD/POST
        location / {
            limit_except GET POST { deny all; }
            limit_req zone=geral burst=40 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
        }

        # Metricas do nginx, apenas para redes internas
        location = /lb-status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;
        }
    }
}
