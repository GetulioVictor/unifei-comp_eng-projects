proxy_pass http://app_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_next_upstream error timeout http_502 http_503;
proxy_next_upstream_tries 3;
proxy_connect_timeout 2s;
proxy_read_timeout    5s;
proxy_send_timeout    5s;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

# Remove cabecalhos que revelam tecnologia do backend
proxy_hide_header X-Powered-By;
proxy_hide_header X-AspNet-Version;
proxy_hide_header Cache-Control;   # o cabecalho correto vem do security-headers.conf

# Forca flags seguras no cookie de sessao emitido pela aplicacao
proxy_cookie_flags sessao httponly samesite=strict;