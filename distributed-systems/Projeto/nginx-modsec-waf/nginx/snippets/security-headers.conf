# Cabecalhos de seguranca aplicados a todas as respostas
# Observacao: um add_header dentro de um location anula estes. Nao use add_header nos locations.

# Impede que a pagina seja carregada em iframe (clickjacking)
add_header X-Frame-Options "DENY" always;

# Impede o navegador de adivinhar o tipo do conteudo (MIME sniffing)
add_header X-Content-Type-Options "nosniff" always;

# Nao envia a URL de origem para outros sites
add_header Referrer-Policy "no-referrer" always;

# Desativa APIs do navegador que a aplicacao nao usa
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Content Security Policy: recursos so do proprio dominio.
# 'unsafe-inline' em script-src foi liberado DE PROPOSITO para a demonstracao de XSS funcionar
# com o WAF desligado. Em producao use script-src 'self' (sem 'unsafe-inline'): isso sozinho
# ja impediria a execucao do XSS, mesmo sem WAF (defesa em camadas).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Isolamento entre origens
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# Filtro XSS legado desativado, conforme recomendacao atual da OWASP
add_header X-XSS-Protection "0" always;

# Nao armazena respostas em cache (dados de login e sessao)
add_header Cache-Control "no-store" always;

# Mostra qual replica atendeu (util na demonstracao; remover em producao)
add_header X-Upstream $upstream_addr always;

# HSTS: so faz sentido com HTTPS e dominio real. Em localhost ele afetaria todas
# as portas do navegador, por isso fica desativado no laboratorio.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
