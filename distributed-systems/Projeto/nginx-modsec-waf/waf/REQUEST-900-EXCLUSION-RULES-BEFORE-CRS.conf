# Regras proprias do WAF, executadas antes do OWASP CRS
# IDs 10000-19999 sao reservados para regras locais
# No modo DetectionOnly elas so registram, sem bloquear

# 10001: bloqueia ferramentas de ataque pelo User-Agent
SecRule REQUEST_HEADERS:User-Agent "@pm sqlmap nikto nmap masscan gobuster dirbuster dirb wpscan nuclei hydra zgrab acunetix netsparker" \
    "id:10001,phase:1,deny,status:403,log,t:none,t:lowercase,\
    msg:'Ferramenta de varredura detectada',tag:'custom/scanner',severity:'CRITICAL'"

# 10002: bloqueia requisicoes sem User-Agent (bots e scripts)
SecRule &REQUEST_HEADERS:User-Agent "@eq 0" \
    "id:10002,phase:1,deny,status:403,log,\
    msg:'Requisicao sem User-Agent',tag:'custom/protocolo',severity:'WARNING'"

# 10003: bloqueia caminhos administrativos e internos
SecRule REQUEST_FILENAME "@rx ^/(?:admin|administrator|phpmyadmin|wp-admin|wp-login\.php|server-status|actuator|lb-status)" \
    "id:10003,phase:1,deny,status:403,log,t:none,t:lowercase,t:normalizePath,\
    msg:'Acesso a caminho administrativo bloqueado',tag:'custom/caminho',severity:'ERROR'"

# 10004: bloqueia arquivos ocultos (.env, .git), exceto .well-known
SecRule REQUEST_FILENAME "@rx /\.(?!well-known)" \
    "id:10004,phase:1,deny,status:403,log,t:none,t:normalizePath,\
    msg:'Acesso a arquivo oculto bloqueado',tag:'custom/caminho',severity:'ERROR'"

# 10005: bloqueia IPs da lista (IPs de exemplo)
SecRule REMOTE_ADDR "@ipMatch 203.0.113.0/24,198.51.100.23" \
    "id:10005,phase:1,deny,status:403,log,\
    msg:'IP em lista de bloqueio',tag:'custom/ip',severity:'CRITICAL'"

# 10006: login so aceita POST
SecRule REQUEST_FILENAME "@streq /api/login" \
    "id:10006,phase:1,deny,status:405,log,\
    msg:'Metodo nao permitido no login',tag:'custom/login',severity:'WARNING',chain"
    SecRule REQUEST_METHOD "!@streq POST" "t:none"

# 10007: login so aceita dados de formulario
SecRule REQUEST_FILENAME "@streq /api/login" \
    "id:10007,phase:1,deny,status:415,log,\
    msg:'Content-Type invalido no login',tag:'custom/login',severity:'WARNING',chain"
    SecRule REQUEST_HEADERS:Content-Type "!@beginsWith application/x-www-form-urlencoded" "t:none,t:lowercase"

# 10008: usuario e senha com no maximo 64 caracteres
SecRule ARGS_POST:username|ARGS_POST:password "@gt 64" \
    "id:10008,phase:2,deny,status:403,log,t:none,t:length,\
    msg:'Campo de login maior que 64 caracteres',tag:'custom/login',severity:'WARNING'"

# 10009: bloqueia usuario ou senha enviados duas vezes (HPP)
SecRule &ARGS_POST:username|&ARGS_POST:password "@gt 1" \
    "id:10009,phase:2,deny,status:403,log,\
    msg:'Parametro de login duplicado (HPP)',tag:'custom/login',severity:'ERROR'"

# 10010: virtual patch, bloqueia o parametro debug em qualquer rota
SecRule ARGS:debug "@rx ^(?:1|true|on|yes)$" \
    "id:10010,phase:2,deny,status:403,log,t:none,t:lowercase,\
    msg:'Virtual patch: parametro debug bloqueado',tag:'custom/virtual-patch',severity:'ERROR'"

